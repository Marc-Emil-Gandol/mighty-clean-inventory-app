databases:
  - name: mighty-clean-db
    plan: free
    databaseName: mightyclean
    user: mightyclean

services:
  - type: web
    name: mighty-clean-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mighty-clean-db
          property: connectionString

  - type: web
    name: mighty-clean-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Update this after the first deploy if your backend's actual
      # Render URL differs from this guess (Render shows it on the
      # backend service's dashboard page).
      - key: VITE_API_URL
        value: https://mighty-clean-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
